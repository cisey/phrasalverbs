<script>
document.addEventListener('DOMContentLoaded', function () {
    const ALPHABET = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('');
    const MAX_WRONG = 6;

    let words = [];
    let current = null;
    let target = '';
    let guessed = new Set();
    let wrongCount = 0;
    let gameOver = false;
    let score = 0;
    let streak = 0;

    const wordEl = document.getElementById('hm-word');
    const lettersEl = document.getElementById('hm-letters');
    const hintEl = document.getElementById('hm-hint');
    const msgEl = document.getElementById('hm-msg');
    const newBtn = document.getElementById('hm-new-btn');
    const detailLink = document.getElementById('hm-detail-link');
    const scoreEl = document.getElementById('hm-score');
    const streakEl = document.getElementById('hm-streak');
    const parts = document.querySelectorAll('.hm-part');
    const decoder = document.createElement('textarea');

    function decodeHTML(str) {
        decoder.innerHTML = str || '';
        return decoder.value;
    }

    function extractWord(title) {
        return decodeHTML(title || '')
            .replace(/\s+ne demek\?.*$/i, '')
            .replace(/^['‘’"]+|['‘’"]+$/g, '')
            .trim()
            .toUpperCase();
    }

    function maskHint(rawText, phrase) {
        if (!rawText) return 'Bu phrasal verb\'ü harf tahmin ederek bul.';
        let cleaned = decodeHTML(rawText).replace(/\s+/g, ' ').trim();

        
        const variants = [phrase, phrase.replace(/\s+/g, '-')];
        variants.forEach(v => {
            const escaped = v.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
            cleaned = cleaned.replace(new RegExp(escaped, 'ig'), '_____');
        });

        
        cleaned = cleaned
            .replace(/^['‘’"]?_____['‘’"]?\s+bir\s+phrasal\s+verb\s+olup\s+/i, '')
            .replace(/^['‘’"]?_____['‘’"]?\s+fiili\s+/i, '')
            .trim();

        if (cleaned.length > 0) {
            cleaned = cleaned.charAt(0).toLocaleUpperCase('tr-TR') + cleaned.slice(1);
        }
        if (cleaned.length > 220) cleaned = cleaned.slice(0, 217) + '...';
        return cleaned || 'Bu phrasal verb\'ü harf tahmin ederek bul.';
    }

    function renderWord() {
        wordEl.innerHTML = '';
        for (const ch of target) {
            if (ch === ' ') {
                const sp = document.createElement('span');
                sp.className = 'hm-space';
                wordEl.appendChild(sp);
            } else if (!/[A-Z]/.test(ch)) {
                const s = document.createElement('span');
                s.className = 'hm-char revealed';
                s.textContent = ch;
                wordEl.appendChild(s);
            } else {
                const s = document.createElement('span');
                const show = guessed.has(ch) || gameOver;
                s.className = 'hm-char' + (guessed.has(ch) ? ' revealed' : '');
                s.textContent = show ? ch : '';
                wordEl.appendChild(s);
            }
        }
    }

    function renderParts() {
        parts.forEach(p => {
            const step = parseInt(p.dataset.step, 10);
            p.classList.toggle('visible', step <= wrongCount);
        });
    }

    function renderKeyboard() {
        lettersEl.innerHTML = '';
        ALPHABET.forEach(letter => {
            const btn = document.createElement('button');
            btn.type = 'button';
            btn.className = 'hm-btn';
            btn.textContent = letter;
            if (guessed.has(letter)) {
                btn.disabled = true;
                btn.classList.add(target.includes(letter) ? 'correct' : 'wrong');
            } else if (gameOver) {
                btn.disabled = true;
            }
            btn.addEventListener('click', () => handleGuess(letter));
            lettersEl.appendChild(btn);
        });
    }

    function checkEnd() {
        const allRevealed = target.split('').every(ch => !/[A-Z]/.test(ch) || guessed.has(ch));
        if (allRevealed) {
            gameOver = true;
            score += 10;
            streak += 1;
            scoreEl.textContent = score;
            streakEl.textContent = streak;
            msgEl.className = 'hm-msg win';
            msgEl.textContent = '🎉 Tebrikler! Doğru bildin: ' + target.toLowerCase();
            detailLink.href = current.permalink || '#';
            detailLink.style.display = 'inline-block';
        } else if (wrongCount >= MAX_WRONG) {
            gameOver = true;
            streak = 0;
            streakEl.textContent = streak;
            msgEl.className = 'hm-msg lose';
            msgEl.textContent = 'Bilemedin! Doğru cevap: ' + target.toLowerCase();
            detailLink.href = current.permalink || '#';
            detailLink.style.display = 'inline-block';
        }
    }

    function handleGuess(letter) {
        if (gameOver || guessed.has(letter)) return;
        guessed.add(letter);
        if (!target.includes(letter)) wrongCount++;
        checkEnd();
        renderParts();
        renderWord();
        renderKeyboard();
    }

    function startNewGame() {
        if (!words.length) return;
        current = words[Math.floor(Math.random() * words.length)];
        target = extractWord(current.title);
        guessed = new Set();
        wrongCount = 0;
        gameOver = false;
        msgEl.textContent = '';
        msgEl.className = 'hm-msg';
        detailLink.style.display = 'none';
        hintEl.textContent = maskHint(current.description, target);
        renderParts();
        renderWord();
        renderKeyboard();
    }

    newBtn.addEventListener('click', startNewGame);

    document.addEventListener('keydown', function (e) {
        const key = e.key.toUpperCase();
        if (/^[A-Z]$/.test(key)) {
            handleGuess(key);
        } else if (e.key === 'Enter' && gameOver) {
            startNewGame();
        }
    });

    fetch('\/phrasalverbs\/index.json')
        .then(r => r.json())
        .then(data => {
            words = data.filter(item => {
                if (!(item.permalink && item.permalink.includes('/phrasal-verbs/') && item.description)) return false;
                if (['/ara/', '/hakkimizda/', '/iletisim/', '/gizlilik-politikasi/', '/kullanim-sartlari/'].some(s => item.permalink.includes(s))) return false;
                const w = extractWord(item.title);
                return /^[A-Z\s-]+$/.test(w) && w.length >= 4 && w.length <= 24;
            });
            startNewGame();
        })
        .catch(() => {
            hintEl.textContent = 'Kelime listesi yüklenemedi.';
        });
});
</script>
