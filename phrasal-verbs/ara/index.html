<div class="pv-search-page">
    <div class="pv-search-head">
        <h1>🔍 Ara</h1>
        <p>İngilizce phrasal verb veya Türkçe anlamıyla arama yapın.</p>
    </div>

    <input type="text" id="page-search-input" placeholder="Örn: blow up, take off, vazgeçmek..." autocomplete="off" autofocus>

<script src="https://cdn.jsdelivr.net/npm/fuse.js@7.0.0/dist/fuse.min.js"></script>
<script>
document.addEventListener('DOMContentLoaded', function () {
    const input = document.getElementById('page-search-input');
    const resultsDiv = document.getElementById('page-search-results');
    const metaDiv = document.getElementById('page-search-meta');
    const excluded = ['/ara/', '/hakkimizda/', '/iletisim/', '/gizlilik-politikasi/', '/kullanim-sartlari/'];
    let fuse = null;

    function cleanName(title) {
        return (title || '')
            .replace(/\s+ne demek\?.*$/i, '')
            .replace(/^['‘’"]+|['‘’"]+$/g, '')
            .trim();
    }

    fetch('\/phrasalverbs\/phrasal-verbs\/index.json')
        .then(r => r.json())
        .then(data => {
            const words = data.filter(item =>
                item.permalink &&
                item.permalink.includes('/phrasal-verbs/') &&
                !excluded.some(s => item.permalink.includes(s))
            );
            fuse = new Fuse(words.length ? words : data, {
                keys: ['title', 'summary', 'description'],
                threshold: 0.3
            });

            const params = new URLSearchParams(window.location.search);
            const q = params.get('q');
            if (q) {
                input.value = q;
                runSearch(q);
            }
        })
        .catch(() => {
            metaDiv.textContent = 'Arama veritabanı yüklenemedi.';
        });

    function runSearch(query) {
        const q = query.trim();
        if (!fuse || q.length < 2) {
            resultsDiv.innerHTML = '';
            metaDiv.textContent = '';
            return;
        }

        const results = fuse.search(q).slice(0, 30);
        if (!results.length) {
            metaDiv.textContent = '0 sonuç bulundu.';
            resultsDiv.innerHTML = '<div class="pv-search-empty">Eşleşen phrasal verb bulunamadı.</div>';
            return;
        }

        metaDiv.textContent = results.length + ' sonuç gösteriliyor.';
        resultsDiv.innerHTML = results.map(r => {
            const item = r.item;
            return `<a href="${item.permalink}" class="pv-search-item">
                <span class="pv-search-item-title">${cleanName(item.title)}</span>
                <span class="pv-search-arrow">→</span>
            </a>`;
        }).join('');
    }

    input.addEventListener('input', function () {
        runSearch(input.value);
    });
});
</script>
