<script>
document.addEventListener('DOMContentLoaded', function () {
    const input = document.getElementById('pv-quick-filter');
    const sections = document.querySelectorAll('.az-section');
    const countBadge = document.getElementById('pv-visible-count');
    const emptyMsg = document.getElementById('pv-empty-msg');

    if (!input) return;

    input.addEventListener('input', function () {
        const q = input.value.trim().toLowerCase();
        let totalVisible = 0;

        sections.forEach(sec => {
            const chips = sec.querySelectorAll('.pv-chip');
            let secVisible = 0;
            chips.forEach(chip => {
                const match = !q || chip.dataset.pv.includes(q);
                chip.style.display = match ? '' : 'none';
                if (match) secVisible++;
            });
            sec.style.display = secVisible > 0 ? '' : 'none';
            totalVisible += secVisible;
        });

        countBadge.textContent = totalVisible;
        emptyMsg.style.display = totalVisible === 0 ? 'block' : 'none';
    });
});
</script>
